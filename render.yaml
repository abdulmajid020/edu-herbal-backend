services:
  # Express Backend Web Service
  - type: web
    name: edu-herbal-backend
    env: node
    plan: starter
    region: oregon
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: edu-herbal-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        value: "*"

databases:
  # Managed PostgreSQL Database
  - name: edu-herbal-postgres
    plan: starter
    region: oregon
    databaseName: edu_herbal_db
    user: edu_herbal_admin
